services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-senior_manage}
      POSTGRES_USER: ${POSTGRES_USER:-senior_manage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-senior_manage} -d $${POSTGRES_DB:-senior_manage}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENIOR_MANAGE_BIND_ADDRESS: 0.0.0.0
      PORT: 8080
      SENIOR_MANAGE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-senior_manage}
      SENIOR_MANAGE_DB_USERNAME: ${POSTGRES_USER:-senior_manage}
      SENIOR_MANAGE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      SENIOR_MANAGE_JWT_SECRET: ${SENIOR_MANAGE_JWT_SECRET:?Configura SENIOR_MANAGE_JWT_SECRET en .env}
      SENIOR_MANAGE_JWT_KEY_ID: ${SENIOR_MANAGE_JWT_KEY_ID:-key-2026-11}
      SENIOR_MANAGE_JWT_ISSUER: ${SENIOR_MANAGE_JWT_ISSUER:-senior-manage-api}
      SENIOR_MANAGE_JWT_AUDIENCE: ${SENIOR_MANAGE_JWT_AUDIENCE:-senior-manage-web}
      SENIOR_MANAGE_FRONTEND_ORIGIN: ${SENIOR_MANAGE_FRONTEND_ORIGIN:-http://localhost}
      SENIOR_MANAGE_AUTO_BOOTSTRAP: ${SENIOR_MANAGE_AUTO_BOOTSTRAP:-true}
      SENIOR_MANAGE_PERMISSION_MATRIX_SHA256: ${SENIOR_MANAGE_PERMISSION_MATRIX_SHA256:-6EDB8C419013B86D62BABAC0A9D1F9668918158AA332AA7BF5B46B9EE60FA969}
      SENIOR_MANAGE_INITIAL_ADMIN_NAME: ${SENIOR_MANAGE_INITIAL_ADMIN_NAME:-Administrador Principal}
      SENIOR_MANAGE_INITIAL_ADMIN_EMAIL: ${SENIOR_MANAGE_INITIAL_ADMIN_EMAIL:-}
      SENIOR_MANAGE_INITIAL_ADMIN_PASSWORD: ${SENIOR_MANAGE_INITIAL_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

